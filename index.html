  .start-stop-btn.is-playing{

  .start-stop-btn:disabled{

  /* ---------- mixer ---------- */
  .mixer{

    min-height:0;
    display:flex;
    gap:10px;

  }
  .channel{
    flex:1;

  .channel-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }

  .channel-label strong{ display:block; font-size:12.5px; font-weight:600; }

  .fader-track{
    flex:1 1 auto;

    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;

  }
  input.fader{
    -webkit-appearance:none;
    appearance:none;

    max-width:180px;
    min-width:70px;
    height:40px;

    transform:rotate(-90deg);
    margin:0;

    --fill:80%;
  }
  input.fader:focus{ outline:none; }

  /* webkit track / thumb */
  input.fader::-webkit-slider-runnable-track{ height:10px; border-radius:6px; }
  input.fader::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:28px; height:28px;
    border-radius:50%;
    background:#fff;
    margin-top:-9px;
    box-shadow:0 2px 6px rgba(0,0,0,.45);
    border:3px solid #999;
  }
  #guideVolume::-webkit-slider-runnable-track{
    background:linear-gradient(to right, var(--guide) 0%, var(--guide) var(--fill), rgba(255,255,255,.09) var(--fill), rgba(255,255,255,.09) 100%);
  }
  #claveVolume::-webkit-slider-runnable-track{
    background:linear-gradient(to right, var(--clave) 0%, var(--clave) var(--fill), rgba(255,255,255,.09) var(--fill), rgba(255,255,255,.09) 100%);
  }
  #guideVolume::-webkit-slider-thumb{ border-color:var(--guide); }
  #claveVolume::-webkit-slider-thumb{ border-color:var(--clave); }

  /* firefox track / thumb (fallback, harmless elsewhere) */
  input.fader::-moz-range-track{ height:10px; border-radius:6px; background:rgba(255,255,255,.09); }
  #guideVolume::-moz-range-progress{ background:var(--guide); height:10px; border-radius:6px; }
  #claveVolume::-moz-range-progress{ background:var(--clave); height:10px; border-radius:6px; }
  input.fader::-moz-range-thumb{
    width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #999;
  }
  #guideVolume::-moz-range-thumb{ border-color:var(--guide); }
  #claveVolume::-moz-range-thumb{ border-color:var(--clave); }

  .channel-value{
    flex-shrink:0;
    font-size:13px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    color:var(--text-dim);
  }

  /* ---------- time training ---------- */
  .time-training-card{
    flex-shrink:0;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    padding:10px 16px 12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .tt-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .tt-title strong{ display:block; font-size:13px; font-weight:600; }
  .tt-title small{ display:block; font-size:10px; color:var(--text-dim); margin-top:2px; line-height:1.35; }

  .switch{
    position:relative;
    width:46px;
    height:27px;
    flex-shrink:0;
  }
  .switch input{
    position:absolute;
    inset:0;
    opacity:0;
    margin:0;
    cursor:pointer;
    z-index:2;
  }
  .switch-track{
    position:absolute;
    inset:0;
    background:#2b313e;
    border-radius:999px;
    transition:background .15s ease-out;
    display:block;
  }
  .switch-thumb{
    position:absolute;
    top:3px; left:3px;
    width:21px; height:21px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 2px 4px rgba(0,0,0,.4);
    transition:transform .15s ease-out;
  }
  .switch input:checked ~ .switch-track{ background:var(--on); }
  .switch input:checked ~ .switch-track .switch-thumb{ transform:translateX(19px); }

  .tt-controls{
    display:flex;
    gap:8px;
  }
  .tt-field{

  @media (prefers-reduced-motion: reduce){

<body>

<div class="global-dim" id="globalDim"></div>

<div class="app-shell">

  <header class="app-header">
    <h1>裏拍トレーナー</h1>
    <p id="modeSubtitle">ガイド音を少しずつ下げて、2拍・4拍のクラーベだけでリズムを刻めるようにしよう</p>
  </header>

  <div class="mode-switch" role="tablist" aria-label="練習モードの切り替え">
    <button class="mode-btn active" id="modeGuideDown" type="button" role="tab" aria-selected="true">Assist</button>
    <button class="mode-btn" id="modeSelfCatch" type="button" role="tab" aria-selected="false">Challenge</button>
  </div>

  <section class="beat-display" aria-label="拍インジケーター">
    <div class="light guide-beat" data-beat="0"><span class="dot"></span><span class="num">1</span></div>
    <div class="light clave-beat" data-beat="1"><span class="dot"></span><span class="num">2</span></div>
    <div class="light guide-beat" data-beat="2"><span class="dot"></span><span class="num">3</span></div>
    <div class="light clave-beat" data-beat="3"><span class="dot"></span><span class="num">4</span></div>
    <div class="mute-overlay" id="muteOverlay"><span class="mute-badge">MUTE</span></div>
  </section>

  <section class="tempo-card">
    <div class="tempo-row">
      <button class="stepper" id="bpmDown" aria-label="テンポを下げる">−</button>
      <div class="tempo-readout">
        <span id="bpmValue">108</span>
        <span class="tempo-unit">BPM</span>
      </div>
      <button class="stepper" id="bpmUp" aria-label="テンポを上げる">＋</button>
    </div>
    <input type="range" id="bpmSlider" class="tempo-slider" min="60" max="200" step="1" value="108" aria-label="テンポスライダー">
    <div class="tempo-scale"><span>60</span><span>200</span></div>
  </section>

  <button id="startStopBtn" class="start-stop-btn" type="button" disabled>Loading...</button>

  <section class="mixer" aria-label="音量ミキサー">
    <div class="channel" data-type="guide">
      <div class="channel-head">
        <span class="channel-dot"></span>
        <div class="channel-label">
          <strong>ガイド音</strong>
          <small>1・2・3・4拍</small>
        </div>
      </div>
      <div class="fader-track">
        <input type="range" id="guideVolume" class="fader" min="0" max="100" step="1" value="80" aria-label="ガイド音の音量">
      </div>
      <span class="channel-value" id="guideVolumeLabel">80%</span>
    </div>

    <div class="channel" data-type="clave">
      <div class="channel-head">
        <span class="channel-dot"></span>
        <div class="channel-label">
          <strong>クラーベ</strong>
          <small>2・4拍(裏拍)</small>
        </div>
      </div>
      <div class="fader-track">
        <input type="range" id="claveVolume" class="fader" min="0" max="100" step="1" value="100" aria-label="クラーベ音の音量">
      </div>
      <span class="channel-value" id="claveVolumeLabel">100%</span>
    </div>
  </section>

  <section class="time-training-card">
    <div class="tt-header">
      <div class="tt-title">
        <strong>タイムトレーニング</strong>
        <small>設定した小節数ごとに自動でミュートし、体内時計でリズムをキープする練習ができる</small>
      </div>
      <label class="switch">
        <input type="checkbox" id="timeTrainingToggle" aria-label="タイムトレーニングのON/OFF">
        <span class="switch-track"><span class="switch-thumb"></span></span>
      </label>
    </div>
    <div class="tt-controls">
      <div class="tt-field">
        <label for="playBars" id="playBarsLabel">鳴らす小節数</label>
        <select id="playBars" disabled>
          <option value="1">1小節</option>
          <option value="2" selected>2小節</option>
          <option value="3">3小節</option>
          <option value="4">4小節</option>
          <option value="5">5小節</option>
          <option value="6">6小節</option>
          <option value="7">7小節</option>
          <option value="8">8小節</option>
        </select>
      </div>
      <div class="tt-field">
        <label for="muteBars" id="muteBarsLabel">ミュートする小節数</label>
        <select id="muteBars" disabled>
          <option value="1">1小節</option>
          <option value="2" selected>2小節</option>
          <option value="3">3小節</option>
          <option value="4">4小節</option>
        </select>
      </div>
    </div>
  </section>

  <p class="hint">慣れてきたらガイド音のフェーダーだけを下げていき、クラーベの「カッ、カッ」だけで拍を感じられるか試してみましょう。</p>

</div>

<script>
(function(){
  "use strict";

  // ---------- DOM refs ----------
  const startStopBtn = document.getElementById('startStopBtn');
  const bpmValueEl = document.getElementById('bpmValue');
  const bpmSlider = document.getElementById('bpmSlider');
  const bpmDown = document.getElementById('bpmDown');
  const bpmUp = document.getElementById('bpmUp');
  const guideVolume = document.getElementById('guideVolume');
  const claveVolume = document.getElementById('claveVolume');
  const guideVolumeLabel = document.getElementById('guideVolumeLabel');
  const claveVolumeLabel = document.getElementById('claveVolumeLabel');
  const lights = Array.from(document.querySelectorAll('.light'));
  const timeTrainingToggle = document.getElementById('timeTrainingToggle');
  const playBarsSelect = document.getElementById('playBars');
  const muteBarsSelect = document.getElementById('muteBars');
  const muteOverlay = document.getElementById('muteOverlay');
  const globalDim = document.getElementById('globalDim');
  const modeGuideDownBtn = document.getElementById('modeGuideDown');
  const modeSelfCatchBtn = document.getElementById('modeSelfCatch');
  const modeSubtitle = document.getElementById('modeSubtitle');
  const playBarsLabel = document.getElementById('playBarsLabel');
  const muteBarsLabel = document.getElementById('muteBarsLabel');

  // ---------- state ----------
  let bpm = 108;
  let isPlaying = false;
  let audioCtx = null;
  let guideMasterGain = null;
  let claveMasterGain = null;

  const lookahead = 25.0;        // ms: how often the scheduler runs
  const scheduleAheadTime = 0.12; // sec: how far ahead we schedule audio
  let currentBeat = 0;           // 0..3 (beat 1..4)
  let nextNoteTime = 0.0;
  let timerID = null;
  let notesInQueue = [];         // {beat, time} for visual sync
  let rafID = null;
  let lastDrawnBeat = -1;

  // ---------- time training mode ----------
  let timeTrainingEnabled = false;
  let playBars = parseInt(playBarsSelect.value, 10);
  let muteBars = parseInt(muteBarsSelect.value, 10);
  let measureCount = 0;      // 再生開始からの小節番号(0始まり)
  let lastMuteShown = false; // 表示中の拍がミュート区間かどうか(視覚同期用)

  // ---------- practice mode (guideDown / selfCatch) ----------
  const MODE_DESCRIPTIONS = {
    guideDown: 'ガイド音を少しずつ下げて、裏拍のクラーベだけでリズムを刻もう',
    selfCatch: '最初はクラーベのみ。自力で表拍を感じて、ガイドが鳴った時に答え合わせをしよう'
  };
  let practiceMode = 'guideDown'; // 'guideDown' | 'selfCatch'

  // ---------- audio setup ----------
  function initAudioContext(){
    if (audioCtx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();

    // マスターリミッター: 個々の音がどれだけ大きくても、出力全体が0dBを超えて
    // 音割れ(クリッピング)しないように最終段でまとめて抑える安全装置。
    // これが無いと、PCのスピーカーやヘッドホンでは気づきにくくても、
    // 別の端末(特にスマホのスピーカー)では音が破裂したように歪んで聞こえることがある。
    const masterLimiter = audioCtx.createDynamicsCompressor();
    masterLimiter.threshold.value = -6;   // -6dBを超えた分を圧縮し始める
    masterLimiter.knee.value = 0;         // 0 = ハードニー(リミッターらしいかかり方)
    masterLimiter.ratio.value = 20;       // 20:1 = ほぼ天井を作るリミッター的な効き方
    masterLimiter.attack.value = 0.003;   // 立ち上がりが速い打撃音にも即座に反応
    masterLimiter.release.value = 0.1;
    masterLimiter.connect(audioCtx.destination);

    guideMasterGain = audioCtx.createGain();
    guideMasterGain.gain.value = guideVolume.value / 100;
    guideMasterGain.connect(masterLimiter);

    claveMasterGain = audioCtx.createGain();
    claveMasterGain.gain.value = claveVolume.value / 100;
    claveMasterGain.connect(masterLimiter);
  }

  // Base64 文字列 → ArrayBuffer に変換
  function base64ToArrayBuffer(base64){
    const binaryStr = atob(base64);
    const len = binaryStr.length;
    const bytes = new Uint8Array(len);
    for (let i = 0; i < len; i++){
      bytes[i] = binaryStr.charCodeAt(i);
    }
    return bytes.buffer;
  }

  // ガイド音声(One/Two/Three/Four) + クラーベ音を Base64 → decodeAudioData で読み込む。
  // HTMLファイル自体に音声データを内包しているため、fetch を使わず file:// でも
  // CORSに引っかからずに動作する。ページ読み込み時点で先読みしておく。
  async function loadGuideSamples(){
    try{
      const [buffers, clave] = await Promise.all([
        Promise.all(
          GUIDE_SOURCES.map((base64) => {
            const arrayBuffer = base64ToArrayBuffer(base64);
            return audioCtx.decodeAudioData(arrayBuffer);
          })
        ),
        audioCtx.decodeAudioData(base64ToArrayBuffer(CLAVE_B64))
      ]);
      guideBuffers = buffers;
      claveBuffer = clave;
      assetsReady = true;
      startStopBtn.textContent = 'START';
      startStopBtn.disabled = false;
    }catch(err){
      console.error(err);
      startStopBtn.textContent = 'Error';
    }
  }

  // ガイド音: "One / Two / Three / Four" の読み上げ音声(AudioBufferSourceNode)
  function playGuideVoice(time, beatIndex){
    const buffer = guideBuffers[beatIndex];
    if (!buffer) return; // 念のため未読み込み時はスキップ
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(guideMasterGain);
    source.start(time);
  }

  // 音声ファイル(AudioBuffer)を再生する方式。再生環境による音色のブレを防げる。
  function playClaveClick(time){
    if (!claveBuffer) return; // 念のため未読み込み時はスキップ
    const source = audioCtx.createBufferSource();
    source.buffer = claveBuffer;
    source.connect(claveMasterGain);
    source.start(time);
  }

    if (practiceMode === 'selfCatch'){
      if (!timeTrainingEnabled) return true;
      return positionInCycle < playBars;
    }
    // guideDown モード
    if (!timeTrainingEnabled) return false;
    return positionInCycle >= playBars;
  }

  function scheduleNote(beatIndex, time){
    const cycleLength = playBars + muteBars;
    const positionInCycle = measureCount % cycleLength;
    const muted = isGuideMuted(positionInCycle);

    notesInQueue.push({ beat: beatIndex, time: time, muted: muted });

    // ミュート判定の時はガイド音(声)だけを止める
    if (!muted){
      playGuideVoice(time, beatIndex);
    }

    // クラーベは2拍目・4拍目(裏拍)のみ。モード・ミュート状態に関わらず常に鳴る
    if (beatIndex === 1 || beatIndex === 3){
      playClaveClick(time);
    }
  }

  function nextNote(){
    const secondsPerBeat = 60.0 / bpm;
    nextNoteTime += secondsPerBeat;
    currentBeat = (currentBeat + 1) % 4;
    if (currentBeat === 0){
      measureCount++; // 4拍(1小節)進むごとに小節カウントを増やす
    }
  }

  function scheduler(){
    while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime){
      scheduleNote(currentBeat, nextNoteTime);
      nextNote();
    }
    timerID = window.setTimeout(scheduler, lookahead);
  }

  // ---------- visual sync (requestAnimationFrame) ----------
  function draw(){
    if (!isPlaying){ return; }
    const currentTime = audioCtx.currentTime;
    let beatToShow = lastDrawnBeat;
    let muteToShow = lastMuteShown;

    while (notesInQueue.length && notesInQueue[0].time <= currentTime){
      const note = notesInQueue.shift();
      beatToShow = note.beat;
      muteToShow = note.muted;
    }

    // 拍インジケーターはミュート中でも点滅を継続させる
    if (beatToShow !== lastDrawnBeat){
      lights.forEach((el, i) => el.classList.toggle('active', i === beatToShow));
      lastDrawnBeat = beatToShow;
    }

    // MUTE中であることを示す視覚演出(バッジ表示 + 画面全体を少し暗く)
    if (muteToShow !== lastMuteShown){
      muteOverlay.classList.toggle('show', muteToShow);
      globalDim.classList.toggle('show', muteToShow);
      lastMuteShown = muteToShow;
    }

    rafID = requestAnimationFrame(draw);
  }

  // ---------- transport ----------
  function start(){
    if (!assetsReady) return; // 読み込み中は再生させない
    initAudioContext();

    // iOS Safari 対策: ユーザー操作のタイミングで必ず resume する
    if (audioCtx.state === 'suspended'){
      audioCtx.resume();
    }

    isPlaying = true;
    currentBeat = 0;
    lastDrawnBeat = -1;
    measureCount = 0;
    lastMuteShown = false;
    muteOverlay.classList.remove('show');
    globalDim.classList.remove('show');
    notesInQueue = [];
    nextNoteTime = audioCtx.currentTime + 0.05;

    scheduler();
    rafID = requestAnimationFrame(draw);

    startStopBtn.textContent = 'STOP';
    startStopBtn.classList.add('is-playing');
    modeGuideDownBtn.disabled = true;
    modeSelfCatchBtn.disabled = true;
  }

  function stop(){
    isPlaying = false;
    if (timerID) window.clearTimeout(timerID);
    if (rafID) cancelAnimationFrame(rafID);
    timerID = null;
    rafID = null;
    notesInQueue = [];
    lastDrawnBeat = -1;
    lastMuteShown = false;
    lights.forEach(el => el.classList.remove('active'));
    muteOverlay.classList.remove('show');
    globalDim.classList.remove('show');

    startStopBtn.textContent = 'START';
    startStopBtn.classList.remove('is-playing');
    modeGuideDownBtn.disabled = false;
    modeSelfCatchBtn.disabled = false;
  }

  startStopBtn.addEventListener('click', () => {
    if (!assetsReady) return;
    if (isPlaying){
      stop();
    }else{
      start();
    }
  });

  // ---------- BPM controls ----------
  function setBpm(v){
    v = Math.min(200, Math.max(60, Math.round(v)));
    bpm = v;
    bpmValueEl.textContent = v;
    bpmSlider.value = v;
  }

  bpmSlider.addEventListener('input', (e) => setBpm(e.target.value));
  bpmDown.addEventListener('click', () => setBpm(bpm - 1));
  bpmUp.addEventListener('click', () => setBpm(bpm + 1));

  // ---------- time training controls ----------
  function updateTTControlsState(){
    const enabled = timeTrainingToggle.checked;
    playBarsSelect.disabled = !enabled;
    muteBarsSelect.disabled = !enabled;
  }

  timeTrainingToggle.addEventListener('change', (e) => {
    timeTrainingEnabled = e.target.checked;
    updateTTControlsState();
  });

  playBarsSelect.addEventListener('change', (e) => {
    playBars = parseInt(e.target.value, 10);
  });

  muteBarsSelect.addEventListener('change', (e) => {
    muteBars = parseInt(e.target.value, 10);
  });

  updateTTControlsState();

  // ---------- volume controls ----------
  function updateFaderFill(el){
    el.style.setProperty('--fill', el.value + '%');
  }

  // ガイド音の音量を一箇所にまとめて反映する(スライダー操作・答え合わせボタン共通で使用)
  function setGuideVolume(v){
    v = Math.max(0, Math.min(100, Math.round(v)));
    guideVolume.value = v;
    guideVolumeLabel.textContent = v + '%';
    updateFaderFill(guideVolume);

    if (guideMasterGain){
      guideMasterGain.gain.value = v / 100;
    }
  }

  guideVolume.addEventListener('input', (e) => setGuideVolume(e.target.value));

  claveVolume.addEventListener('input', (e) => {
    const v = e.target.value;
    claveVolumeLabel.textContent = v + '%';
    updateFaderFill(e.target);
    if (claveMasterGain) claveMasterGain.gain.value = v / 100;
  });

  // ---------- practice mode switch ----------
  function applyModeUI(){
    const isSelfCatch = practiceMode === 'selfCatch';

    modeGuideDownBtn.classList.toggle('active', !isSelfCatch);
    modeGuideDownBtn.setAttribute('aria-selected', String(!isSelfCatch));
    modeSelfCatchBtn.classList.toggle('active', isSelfCatch);
    modeSelfCatchBtn.setAttribute('aria-selected', String(isSelfCatch));

    modeSubtitle.textContent = MODE_DESCRIPTIONS[practiceMode];

    // タイムトレーニングのラベルをモードに応じて動的に書き換える
    if (isSelfCatch){
      playBarsLabel.textContent = '自力でとる小節数';
      muteBarsLabel.textContent = '答え合わせ小節数(ガイドON)';
    }else{
      playBarsLabel.textContent = '鳴らす小節数';
      muteBarsLabel.textContent = 'ミュートする小節数';
    }
  }

  function setPracticeMode(mode){
    if (isPlaying) return; // 再生中はモードを切り替えない(タブ自体もdisabledになる)
    practiceMode = mode;
    applyModeUI();
  }

  modeGuideDownBtn.addEventListener('click', () => setPracticeMode('guideDown'));
  modeSelfCatchBtn.addEventListener('click', () => setPracticeMode('selfCatch'));

  // 初期表示
  applyModeUI();
  updateFaderFill(guideVolume);
  updateFaderFill(claveVolume);
  setBpm(bpm);

  // AudioContext はユーザー操作前に生成しても問題ない(resume() だけ gesture 内で行う)。
  // ページを開いた時点でガイド音声のデコードを開始し、完了までPlayボタンを無効化しておく。
  initAudioContext();
  loadGuideSamples();

})();
</script>

</body>
